<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานการทำงานเครื่องจักร</title>
    <style>
        :root {
            --primary: #0056b3;
            --success: #28a745;
            --danger: #dc3545;
            --bg: #f4f6f9;
            --border: #ced4da;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 850px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 25px; }

        /* Section Styles */
        .section-box { border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; background: #fff; position: relative; }
        .section-title { font-weight: bold; color: var(--primary); margin-bottom: 15px; border-bottom: 2px solid #e9ecef; padding-bottom: 5px; font-size: 16px; }

        /* Layouts */
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

        /* ช่องลงเวลา 3 ช่องในแถวเดียวกัน */
        .time-row-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 6px;
            border: 1px dashed #cbd5e0;
        }

        /* กล่อง Problem of stop M/C แยกออกมาต่างหาก */
        .stop-row-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 15px;
            background: #fff5f5;
            padding: 15px;
            border-radius: 6px;
            border: 1px dashed #e0a0a0;
        }
        .stop-row-container .form-group { margin-bottom: 0; }
        .label-stop { color: var(--danger); font-weight: bold; font-size: 12.5px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
        .time-row-container .form-group { margin-bottom: 0; }

        label { font-size: 13px; font-weight: 600; color: #495057; }
        .label-sub { color: #0056b3; font-weight: bold; font-size: 12.5px; }

        input[type="text"], input[type="date"], select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            background-color: #fff;
            color: #212529;
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; }

        /* ช่องวันที่ dd/mm/yyyy + ปุ่มปฏิทิน */
        .date-wrap { position: relative; }
        #report-date { padding-right: 42px; }
        .btn-date { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; padding: 4px 8px; font-size: 16px; }

        /* ปฏิทินเลือกวันที่ */
        .cal-pop { display: none; position: absolute; top: 100%; right: 0; margin-top: 6px; width: 280px; background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); padding: 12px; z-index: 50; }
        .cal-pop.open { display: block; }
        .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .cal-head button { background: #e9ecef; color: #333; padding: 4px 12px; font-size: 16px; }
        .cal-head button:hover { background: #dee2e6; }
        .cal-title { font-weight: bold; color: var(--primary); font-size: 14px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
        .cal-dow { font-size: 12px; color: #6c757d; font-weight: 600; padding: 4px 0; }
        .cal-day { background: none; color: #212529; padding: 7px 0; font-size: 13px; font-weight: normal; border-radius: 4px; }
        .cal-day:hover { background: #e7f1ff; }
        .cal-day.today { border: 1px solid var(--primary); }
        .cal-day.selected { background: var(--primary); color: #fff; }
        .cal-foot { margin-top: 8px; text-align: center; }
        .cal-foot button { background: none; color: var(--primary); font-size: 13px; padding: 4px 10px; }

        /* Buttons */
        button { font-size: 15px; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-add { background: #e2e8f0; color: #2d3748; width: 100%; margin-bottom: 20px; border: 2px dashed #a0aec0; }
        .btn-add:hover { background: #cbd5e0; }
        .btn-submit { background: var(--success); color: white; width: 100%; }
        .btn-submit:hover { background: #218838; }
        .btn-delete { background: var(--danger); color: white; padding: 5px 12px; font-size: 12px; position: absolute; top: 15px; right: 15px; border-radius: 4px; }
        .btn-delete:hover { background: #bb2d3b; }

        /* เหลือรายการเดียว: ซ่อนปุ่มลบ (ต้องมีอย่างน้อย 1 รายการ) */
        #work-items-container.only-one .btn-delete { display: none; }

        .btn-excel { background: #217346; color: white; width: 100%; margin-top: 10px; }
        .btn-excel:hover { background: #1a5c38; }

        /* ตัวเลือกเวลา 24 ชั่วโมง */
        .range-field { display: flex; flex-direction: column; gap: 6px; }
        .range-list { display: flex; flex-direction: column; gap: 6px; }
        .range-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .range-row select { width: auto; flex: 1; min-width: 80px; padding: 8px 6px; }
        .r-sep { font-size: 12px; color: #6c757d; }
        .r-note { width: 100%; font-size: 11px; color: #b45309; }
        .range-row.invalid select { border-color: var(--danger); background: #fff5f5; }
        .range-row.invalid .r-note { color: var(--danger); font-weight: 600; }
        .range-row .r-detail { flex: 1 1 100%; }
        .label-minus { font-size: 12px; font-weight: 600; color: #b45309; margin-top: 6px; }
        .btn-range-del { background: #e9ecef; color: #495057; padding: 4px 9px; font-size: 12px; border-radius: 4px; }
        .btn-range-del:hover { background: #dee2e6; }
        .btn-range-add { background: none; color: var(--primary); border: 1px dashed var(--primary); font-size: 12px; padding: 5px 8px; align-self: flex-start; }
        .btn-range-add:hover { background: #e7f1ff; }

        .btn-sheets { background: #1a73e8; color: white; width: 100%; margin-top: 10px; }
        .btn-sheets:hover { background: #1558b0; }
        .btn-sheets:disabled { background: #8ab4f8; cursor: wait; }

        /* Output Box */
        .output-box { margin-top: 25px; padding: 15px; background: #222; color: #00ff00; border-radius: 8px; font-family: monospace; font-size: 13px; display: none; }

        @media (max-width: 650px) {
            .grid-3, .time-row-container, .stop-row-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>รายงานการทำงานเครื่องจักร<br><small style="font-size: 13px; font-weight: normal; color: #6c757d;">Machine Operation Report</small></h2>

    <!-- หัวข้อที่ 1 -->
    <div class="section-box">
        <div class="section-title">หัวข้อที่ 1: ข้อมูลเครื่องจักรและพนักงาน</div>
        <div class="grid-3">
            <div class="form-group">
                <label>เลือกเครื่องจักร (8 เครื่อง)</label>
                <select id="machine-name">
                    <option value="">-- กรุณาเลือกเครื่องจักร --</option>
                    <option value="CNC Makino V56i">CNC Makino V56i</option>
                    <option value="Okuma MB-80V">Okuma MB-80V</option>
                    <option value="CNC Lathe Takizawa TCN-2500">CNC Lathe Takizawa TCN-2500</option>
                    <option value="Super Drill Sodick K3BL">Super Drill Sodick K3BL</option>
                    <option value="Wire Cut Sodick AG400LP">Wire Cut Sodick AG400LP</option>
                    <option value="EDM Sodick AG60L">EDM Sodick AG60L</option>
                    <option value="Surface Grinding Okamoto ACC106CA">Surface Grinding Okamoto ACC106CA</option>
                    <option value="WIRE CUT AL400G">WIRE CUT AL400G</option>
                </select>
            </div>
            <div class="form-group">
                <label>ชื่อพนักงาน</label>
                <input type="text" id="operator-name" placeholder="ใส่ชื่อพนักงาน">
            </div>
            <div class="form-group">
                <label>วันที่</label>
                <div class="date-wrap">
                    <input type="text" id="report-date" placeholder="วว/ดด/ปปปป" maxlength="10" inputmode="numeric" autocomplete="off">
                    <button type="button" class="btn-date" id="btn-date-pick" title="เลือกจากปฏิทิน">📅</button>
                    <div class="cal-pop" id="cal-pop"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- บันทึกรายการงาน (หัวข้อที่ 2) : เพิ่ม/ลบได้ไม่จำกัด -->
    <div id="work-items-container" class="only-one">
        <div class="section-box work-item">
            <div class="section-title">หัวข้อที่ 2: บันทึกรายการงานที่ <span class="item-number">1</span></div>
            <button type="button" class="btn-delete">ลบออก</button>

            <div class="grid-3">
                <div class="form-group">
                    <label>เลขแม่พิมพ์ (Mold No.)</label>
                    <input type="text" class="input-mold" placeholder="เช่น MOLD-A01">
                </div>
                <div class="form-group">
                    <label>เลขที่ใบขอ (Request No.)</label>
                    <input type="text" class="input-request" placeholder="เช่น REQ-102">
                </div>
                <div class="form-group">
                    <label>ประเภทงาน (Work)</label>
                    <select class="input-work">
                        <option value="">-- เลือกประเภทงาน --</option>
                        <option value="R">R</option>
                        <option value="N">N</option>
                        <option value="O">O</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="margin-top: 5px;">
                <label>รายละเอียดงาน (Work Detail)</label>
                <input type="text" class="input-detail" placeholder="เช่น cutting insert">
            </div>

            <div class="time-row-container">
                <div class="form-group">
                    <label class="label-sub">1. เวลาเดินเครื่องอัตโนมัติ (Auto Run)</label>
                    <div class="range-field">
                        <div class="range-list"></div>
                        <button type="button" class="btn-range-add">+ เพิ่มช่วงเวลา</button>
                        <input type="hidden" class="time-autorun">
                    </div>
                    <label class="label-minus">− เวลาหยุดของเครื่องเดินอัตโนมัติ (หักออกจากเวลาด้านบน)</label>
                    <div class="range-field" data-optional="1">
                        <div class="range-list"></div>
                        <button type="button" class="btn-range-add">+ เพิ่มเวลาหยุด</button>
                        <input type="hidden" class="time-autorun-stop">
                    </div>
                </div>
                <div class="form-group">
                    <label class="label-sub">2. เวลาพนักงานคุมเครื่อง (Operator)</label>
                    <div class="range-field">
                        <div class="range-list"></div>
                        <button type="button" class="btn-range-add">+ เพิ่มช่วงเวลา</button>
                        <input type="hidden" class="time-operator">
                    </div>
                    <label class="label-minus">− เวลาหยุด / พัก ของพนักงาน (หักออกจากเวลาด้านบน)</label>
                    <div class="range-field" data-optional="1">
                        <div class="range-list"></div>
                        <button type="button" class="btn-range-add">+ เพิ่มเวลาหยุด / พัก</button>
                        <input type="hidden" class="time-operator-stop">
                    </div>
                </div>
            </div>

            <div class="stop-row-container">
                <div class="form-group">
                    <label class="label-stop">3. เครื่องหยุด / ปัญหา (Problem of stop M/C) เวลา + รายละเอียด</label>
                    <div class="range-field stop-field" data-detail="1">
                        <div class="range-list"></div>
                        <button type="button" class="btn-range-add">+ เพิ่มช่วงเวลา</button>
                        <input type="hidden" class="time-stop">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ปุ่มเพิ่มหัวข้อที่ 2 -->
    <button type="button" class="btn-add" id="btn-add-work">➕ คลิกเพื่อเพิ่ม "รายการงานใหม่"</button>

    <!-- ปุ่มส่งข้อมูล -->
    <button type="button" class="btn-submit" id="btn-submit-report">ส่งข้อมูลรายงานทั้งหมด</button>

    <!-- ปุ่มดาวน์โหลด Excel (ฟอร์มต้นฉบับ) -->
    <button type="button" class="btn-excel" id="btn-export-xlsx">📥 ดาวน์โหลดเป็นไฟล์ Excel (ฟอร์มเดิม)</button>

    <!-- ปุ่มส่งเข้า Google Sheets -->
    <button type="button" class="btn-sheets" id="btn-send-sheets">📤 ส่งข้อมูล + บันทึกไฟล์ Excel ลง Google Drive</button>

    <!-- กล่องแสดงผลลัพธ์ -->
    <div class="output-box" id="output-preview">
        <strong>[สำเร็จ] ข้อมูลที่ระบบได้รับ:</strong>
        <pre id="json-result" style="white-space: pre-wrap; margin-top: 10px;"></pre>
    </div>
</div>

<script>
    var container = document.getElementById('work-items-container');

    // เก็บรายการแรกเป็นแม่แบบ (ตอนยังว่าง) เพื่อให้ทุกรายการที่เพิ่มมามีรูปแบบเหมือนเดิมเสมอ
    var template = container.querySelector('.work-item').cloneNode(true);

    // ===== วันที่รูปแบบ dd/mm/yyyy =====
    var dateInput = document.getElementById('report-date');

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function formatDate(d) { return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }

    // ตรวจว่าเป็นวันที่ที่มีอยู่จริงหรือไม่ (คืน Date หรือ null)
    function parseDate(str) {
        var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(str);
        if (!m) return null;
        var d = new Date(+m[3], +m[2] - 1, +m[1]);
        if (d.getFullYear() !== +m[3] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[1]) return null;
        return d;
    }

    // ตั้งเป็นวันที่ปัจจุบัน
    dateInput.value = formatDate(new Date());

    // พิมพ์เฉพาะตัวเลข ระบบใส่ / ให้อัตโนมัติ
    dateInput.addEventListener('input', function () {
        var d = this.value.replace(/\D/g, '').slice(0, 8);
        var out = d;
        if (d.length > 4) out = d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4);
        else if (d.length > 2) out = d.slice(0, 2) + '/' + d.slice(2);
        this.value = out;
    });

    // ===== ปฏิทินเลือกวันที่ (สร้างเอง ใช้ได้ทุกเบราว์เซอร์) =====
    var calPop = document.getElementById('cal-pop');
    var viewY = 0, viewM = 0;
    var MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    var DOWS = ['อา','จ','อ','พ','พฤ','ศ','ส'];

    function renderCal() {
        var sel = parseDate(dateInput.value);
        var today = new Date();
        var html = '<div class="cal-head">' +
            '<button type="button" id="cal-prev">&#8249;</button>' +
            '<span class="cal-title">' + MONTHS[viewM] + ' ' + viewY + '</span>' +
            '<button type="button" id="cal-next">&#8250;</button></div>' +
            '<div class="cal-grid">';
        for (var i = 0; i < 7; i++) html += '<div class="cal-dow">' + DOWS[i] + '</div>';
        var first = new Date(viewY, viewM, 1).getDay();
        var days = new Date(viewY, viewM + 1, 0).getDate();
        for (var b = 0; b < first; b++) html += '<div></div>';
        for (var d = 1; d <= days; d++) {
            var cls = 'cal-day';
            if (d === today.getDate() && viewM === today.getMonth() && viewY === today.getFullYear()) cls += ' today';
            if (sel && d === sel.getDate() && viewM === sel.getMonth() && viewY === sel.getFullYear()) cls += ' selected';
            html += '<button type="button" class="' + cls + '" data-day="' + d + '">' + d + '</button>';
        }
        html += '</div><div class="cal-foot"><button type="button" id="cal-today">วันนี้</button></div>';
        calPop.innerHTML = html;
    }

    function openCal() {
        var base = parseDate(dateInput.value) || new Date();
        viewY = base.getFullYear();
        viewM = base.getMonth();
        renderCal();
        calPop.classList.add('open');
    }
    function closeCal() { calPop.classList.remove('open'); }

    document.getElementById('btn-date-pick').addEventListener('click', function () {
        if (calPop.classList.contains('open')) closeCal(); else openCal();
    });

    calPop.addEventListener('click', function (e) {
        e.stopPropagation();
        var t = e.target;
        if (t.id === 'cal-prev') {
            viewM--; if (viewM < 0) { viewM = 11; viewY--; }
            renderCal();
        } else if (t.id === 'cal-next') {
            viewM++; if (viewM > 11) { viewM = 0; viewY++; }
            renderCal();
        } else if (t.id === 'cal-today') {
            dateInput.value = formatDate(new Date());
            closeCal();
        } else if (t.getAttribute('data-day')) {
            dateInput.value = formatDate(new Date(viewY, viewM, +t.getAttribute('data-day')));
            closeCal();
        }
    });

    // คลิกนอกปฏิทิน หรือกด Esc เพื่อปิด
    document.addEventListener('click', function (e) {
        if (!e.target.closest('.date-wrap')) closeCal();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeCal();
    });

    // เรียงเลขรายการใหม่ + ซ่อนปุ่มลบเมื่อเหลือรายการเดียว
    function refresh() {
        var items = container.querySelectorAll('.work-item');
        for (var i = 0; i < items.length; i++) {
            var span = items[i].querySelector('.item-number');
            if (span) span.textContent = (i + 1);
        }
        if (items.length <= 1) {
            container.classList.add('only-one');
        } else {
            container.classList.remove('only-one');
        }
    }

    function addNewWork() {
        var item = template.cloneNode(true);
        container.appendChild(item);
        initItem(item);
        refresh();
        var first = item.querySelector('input');
        if (first) first.focus();
        item.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function hasData(item) {
        var fields = item.querySelectorAll('input, select');
        for (var i = 0; i < fields.length; i++) {
            if (fields[i].value.trim() !== '') return true;
        }
        return false;
    }

    // ลบรายการ (ใช้ event delegation จึงทำงานกับทุกรายการที่เพิ่มมาใหม่)
    container.addEventListener('click', function (e) {
        if (!e.target.classList.contains('btn-delete')) return;
        var items = container.querySelectorAll('.work-item');
        if (items.length <= 1) return;
        var item = e.target.closest('.work-item');
        if (hasData(item) && !confirm('รายการนี้มีข้อมูลอยู่ ต้องการลบหรือไม่?')) return;
        item.remove();
        refresh();
    });

    document.getElementById('btn-add-work').addEventListener('click', addNewWork);

    // รวบรวมข้อมูลทั้งหมด
    document.getElementById('btn-submit-report').addEventListener('click', function () {
        if (!rangesOk()) return;
        if (!parseDate(dateInput.value)) {
            alert('กรุณากรอกวันที่ให้ถูกต้อง ในรูปแบบ วว/ดด/ปปปป เช่น 25/12/2026');
            dateInput.focus();
            return;
        }
        var works = [];
        var items = container.querySelectorAll('.work-item');
        for (var i = 0; i < items.length; i++) {
            var it = items[i];
            works.push({
                no: i + 1,
                moldNo: it.querySelector('.input-mold').value.trim(),
                requestNo: it.querySelector('.input-request').value.trim(),
                work: it.querySelector('.input-work').value,
                workDetail: it.querySelector('.input-detail').value.trim(),
                autoRun: it.querySelector('.time-autorun').value.trim(),
                operator: it.querySelector('.time-operator').value.trim(),
                autoRunStop: it.querySelector('.time-autorun-stop').value.trim(),
                operatorStop: it.querySelector('.time-operator-stop').value.trim(),
                problemStops: stopsOf(it)
            });
        }

        var data = {
            machine: document.getElementById('machine-name').value,
            operatorName: document.getElementById('operator-name').value.trim(),
            date: dateInput.value,
            workItems: works
        };

        document.getElementById('json-result').textContent = JSON.stringify(data, null, 2);
        var box = document.getElementById('output-preview');
        box.style.display = 'block';

    function cellRe(ref) { return new RegExp('<c r="' + ref + '"( s="\\d+")?(?: t="s")?(?:/>|>[\\s\\S]*?</c>)'); }
    function putStr(x, ref, text) {
        return x.replace(cellRe(ref), function (m, s) { return '<c r="' + ref + '"' + (s || '') + ' t="inlineStr"><is><t xml:space="preserve">' + xesc(text) + '</t></is></c>'; });
    }
    function putNum(x, ref, v) {
        return x.replace(cellRe(ref), function (m, s) { return '<c r="' + ref + '"' + (s || '') + '><v>' + v + '</v></c>'; });
    }
    function putFormula(x, ref, f, v) {
        return x.replace(cellRe(ref), function (m, s) { return '<c r="' + ref + '"' + (s || '') + '><f>' + xesc(f) + '</f><v>' + v + '</v></c>'; });
    }

    // ---- เขียนไฟล์ zip (.xlsx)
    function makeZip(files) {
        var chunks = [], cen = [], off = 0, enc = new TextEncoder();
        files.forEach(function (f) {
            var nm = enc.encode(f.n), h = new Uint8Array(30 + nm.length), dv = new DataView(h.buffer);
            dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true); dv.setUint16(8, f.m, true);
            dv.setUint16(12, 0x21, true); dv.setUint32(14, f.crc, true); dv.setUint32(18, f.d.length, true); dv.setUint32(22, f.usz, true);
            dv.setUint16(26, nm.length, true); h.set(nm, 30);
            chunks.push(h, f.d);
            var c = new Uint8Array(46 + nm.length), cv = new DataView(c.buffer);
            cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true); cv.setUint16(10, f.m, true);
            cv.setUint16(14, 0x21, true); cv.setUint32(16, f.crc, true); cv.setUint32(20, f.d.length, true); cv.setUint32(24, f.usz, true);
            cv.setUint16(28, nm.length, true); cv.setUint32(42, off, true); c.set(nm, 46);
            cen.push(c);
            off += h.length + f.d.length;
        });
        var cs = 0; cen.forEach(function (c) { cs += c.length; });
        var e = new Uint8Array(22), ev = new DataView(e.buffer);
        ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
        ev.setUint32(12, cs, true); ev.setUint32(16, off, true);
        return new Blob(chunks.concat(cen, [e]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    }

    function makeXlsx() {
        if (!rangesOk()) return null;
        var d = parseDate(dateInput.value);
        if (!d) { alert('กรุณากรอกวันที่ให้ถูกต้อง ในรูปแบบ วว/ดด/ปปปป'); dateInput.focus(); return null; }
        var mi = document.getElementById('machine-name').selectedIndex - 1;
        if (mi < 0) { alert('กรุณาเลือกเครื่องจักรก่อน'); return null; }

        var grid = buildGrid(readReport());
        var serial = Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / 86400000);
        var dec = new TextDecoder(), enc = new TextEncoder(), files = [];

        PKG.forEach(function (p) {
            var u = b64(p.d), f = { n: p.n, m: p.m, crc: p.crc, usz: p.usz, d: u };
            if (p.n === 'xl/worksheets/sheet1.xml') {
                var x = dec.decode(u);
                x = putStr(x, 'D6', MACH[mi].n);
                x = x.replace(/(<c r="J6"[^>]*><f>[\s\S]*?<\/f><v>)[^<]*(<\/v>)/, function (m, a, b) { return a + xesc(MACH[mi].c) + b; });
                x = putNum(x, 'Q61', serial);
                var cnt = { G: 0, H: 0, I: 0 };
                for (var i = 0; i < 48; i++) {
                    ['B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'K'].forEach(function (c) {
                        var v = grid.rows[i][c];
                        if (v !== '') { x = putStr(x, c + (10 + i), v); if (cnt[c] !== undefined) cnt[c]++; }
                    });
                }
                // สรุปเวลา (ชั่วโมง) แถว Total 24 Hr. : จำนวน ✓ x 0.5 ชม.
                ['G', 'H', 'I'].forEach(function (c) {
                    x = putFormula(x, c + '58', 'COUNTIF(' + c + '10:' + c + '57,"\u2713")/2', cnt[c] / 2);
                });
                f.d = enc.encode(x); f.crc = crc32(f.d); f.usz = f.d.length;
            } else if (p.n === 'xl/workbook.xml') {
                var w = dec.decode(u).replace('<calcPr calcId="191029"/>', '<calcPr calcId="191029" fullCalcOnLoad="1"/>');
                f.d = enc.encode(w); f.crc = crc32(f.d); f.usz = f.d.length;
            }
            files.push(f);
        });

        return { blob: makeZip(files), name: MACH[mi].c.trim() + '_' + dateInput.value.replace(/\//g, '-') + '.xlsx', warns: grid.warns };
    }

    document.getElementById('btn-export-xlsx').addEventListener('click', function () {
        var r = makeXlsx();
        if (!r) return;
        var a = document.createElement('a');
        a.href = URL.createObjectURL(r.blob);
        a.download = r.name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
        if (r.warns.length) alert('ดาวน์โหลดแล้ว แต่มีข้อสังเกต:\n\n' + r.warns.join('\n'));
    });

    // ===== เลือกเวลาแบบ 24 ชั่วโมง (ทีละ 30 นาที ตรงกับตาราง Excel) เพิ่มได้หลายช่วงต่อช่อง =====
    function pad2(n) { return n < 10 ? '0' + n : '' + n; }
    function timeOpts(isEnd) {
        var h = '<option value="">--:--</option>', i, m;
        for (i = isEnd ? 1 : 0; i <= (isEnd ? 48 : 47); i++) {
            m = i * 30;
            var t = pad2(Math.floor(m / 60)) + '.' + pad2(m % 60);
            h += '<option value="' + t + '">' + t.replace('.', ':') + '</option>';
        }
        return h;
    }
    var OPT_START = timeOpts(false), OPT_END = timeOpts(true);

    function addRangeRow(field) {
        var row = document.createElement('div');
        row.className = 'range-row';
        row.innerHTML = '<select class="r-start">' + OPT_START + '</select><span class="r-sep">ถึง</span>' +
            '<select class="r-end">' + OPT_END + '</select>' +
            '<button type="button" class="btn-range-del" title="ลบช่วงเวลานี้">\u2715</button>' +
            (field.getAttribute('data-detail') ? '<input type="text" class="r-detail" placeholder="รายละเอียดปัญหา เช่น No Operator, รอวัสดุ, เครื่อง alarm">' : '') +
            '<span class="r-note"></span>';
        field.querySelector('.range-list').appendChild(row);
    }
    function initItem(item) {
        var f = item.querySelectorAll('.range-field');
        for (var i = 0; i < f.length; i++) if (!f[i].hasAttribute('data-optional')) addRangeRow(f[i]);
    }
    // อัปเดตค่าที่ใช้ส่งออก (เช่น "08.30-12.00, 13.00-14.00") และไฮไลต์ช่วงที่เลือกไม่ครบ
    function syncField(field) {
        var rows = field.querySelectorAll('.range-row'), out = [];
        for (var i = 0; i < rows.length; i++) {
            var st = rows[i].querySelector('.r-start').value, en = rows[i].querySelector('.r-end').value;
            var dEl = rows[i].querySelector('.r-detail'), hasD = !!(dEl && dEl.value.trim());
            var partial = ((st !== '') !== (en !== '')) || (hasD && st === '' && en === ''), same = st !== '' && st === en, note = '';
            if (same) note = 'เวลาเริ่มและสิ้นสุดต้องไม่เท่ากัน';
            else if (partial) note = 'กรุณาเลือกเวลาให้ครบทั้งเริ่มและสิ้นสุด';
            else if (st && en && toMin(en) < toMin(st)) note = 'ข้ามเที่ยงคืน (สิ้นสุดวันถัดไป)';
            rows[i].classList.toggle('invalid', partial || same);
            rows[i].querySelector('.r-note').textContent = note;
            if (st && en && st !== en) out.push(st + '-' + en);
        }
        field.querySelector('input[type="hidden"]').value = out.join(', ');
    }
    function rangesOk() {
        var bad = container.querySelector('.range-row.invalid');
        if (!bad) return true;
        alert('มีช่วงเวลาที่เลือกไม่ถูกต้อง (ไฮไลต์สีแดง) กรุณาแก้ไขก่อน');
        bad.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return false;
    }
    container.addEventListener('change', function (e) {
        var f = e.target.closest('.range-field');
        if (f) syncField(f);
    });
    container.addEventListener('click', function (e) {
        var t = e.target, f = t.closest('.range-field');
        if (!f) return;
        if (t.classList.contains('btn-range-add')) {
            addRangeRow(f);
        } else if (t.classList.contains('btn-range-del')) {
            var row = t.closest('.range-row');
            if (f.querySelectorAll('.range-row').length > 1 || f.hasAttribute('data-optional')) {
                row.remove();
            } else {
                row.querySelector('.r-start').value = '';
                row.querySelector('.r-end').value = '';
            }
            syncField(f);
        }
    });
    container.addEventListener('input', function (e) {
        if (!e.target.classList.contains('r-detail')) return;
        var f = e.target.closest('.range-field');
        if (f) syncField(f);
    });
    initItem(container.querySelector('.work-item'));

    // ===== ส่งข้อมูลเข้า Google Sheets (ผ่าน Google Apps Script) =====
    var SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwIYUIVn-0zyAD0nzXWN6_OiRfbmfXOSnxHht7dYq1ijnmU9Okdc1-g4AmvyNgAog_5/exec';                 // วาง Web app URL ของ Apps Script (ลงท้ายด้วย /exec)
    var SHEETS_TOKEN = 'c646e0949f4fc99a';      // ต้องตรงกับ TOKEN ในสคริปต์
    var pendingId = null;                // รหัสการส่ง ใช้กันข้อมูลซ้ำเมื่อกดส่งซ้ำ

    function blobToBase64(blob) {
        return new Promise(function (resolve, reject) {
            var fr = new FileReader();
            fr.onload = function () { resolve(String(fr.result).split(',')[1]); };
            fr.onerror = function () { reject(new Error('อ่านไฟล์ Excel ไม่สำเร็จ')); };
            fr.readAsDataURL(blob);
        });
    }

    function hrsOf(list) {
        var set = {}, n = 0;
        list.forEach(function (k) { if (!set[k]) { set[k] = 1; n++; } });
        return n / 2;
    }

    document.getElementById('btn-send-sheets').addEventListener('click', function () {
        if (!rangesOk()) return;
        if (!SHEETS_URL) { alert('ยังไม่ได้ตั้งค่าลิงก์ Google Sheets ในฟอร์ม'); return; }
        var d = parseDate(dateInput.value);
        if (!d) { alert('กรุณากรอกวันที่ให้ถูกต้อง ในรูปแบบ วว/ดด/ปปปป'); dateInput.focus(); return; }
        var mi = document.getElementById('machine-name').selectedIndex - 1;
        if (mi < 0) { alert('กรุณาเลือกเครื่องจักรก่อน'); return; }

        var data = readReport(), g = buildGrid(data);
        if (g.warns.length && !confirm('มีข้อสังเกต:\n\n' + g.warns.join('\n') + '\n\nต้องการส่งต่อหรือไม่?')) return;

        var rows = [];
        data.items.forEach(function (w) {
            if (!(w.requestNo || w.moldNo || w.workDetail || w.work || w.autoRun || w.operator || w.stops.length)) return;
            var ar = minus(slotsOf(w.autoRun).slots, slotsOf(w.autoRunStop).slots);
            var op = minus(slotsOf(w.operator).slots, slotsOf(w.operatorStop).slots);
            var st = [];
            w.stops.forEach(function (x) { st = st.concat(slotsOf(x.time).slots); });
            rows.push({
                no: w.no, requestNo: w.requestNo, moldNo: w.moldNo, work: w.work, workDetail: w.workDetail,
                autoRun: w.autoRun, autoRunStop: w.autoRunStop, operator: w.operator, operatorStop: w.operatorStop,
                stops: w.stops.map(function (x) { return x.time + (x.reason ? ' (' + x.reason + ')' : ''); }).join('; '),
                autoRunHr: hrsOf(ar), operatorHr: hrsOf(op), stopHr: hrsOf(st)
            });
        });
        if (!rows.length) { alert('ยังไม่มีข้อมูลรายการงานให้ส่ง'); return; }

        pendingId = pendingId || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
        var payload = {
            token: SHEETS_TOKEN, id: pendingId, submittedAt: new Date().toISOString(),
            date: dateInput.value, machineNo: MACH[mi].c.trim(), machine: MACH[mi].n.replace(/\s+/g, ' ').trim(),
            operatorName: data.operatorName, rows: rows,
            machineRaw: MACH[mi].n,
            grid: g.rows.map(function (r) { return { B: r.B, C: r.C, D: r.D, E: r.E, F: r.F, G: r.G, H: r.H, I: r.I, K: r.K }; })
        };

        var xl = makeXlsx();
        if (!xl) return;

        var btn = this, label = btn.textContent;
        btn.disabled = true; btn.textContent = 'กำลังส่ง...';
        blobToBase64(xl.blob)
            .then(function (b) {
                payload.xlsx = b; payload.fileName = xl.name;
                return fetch(SHEETS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
            })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (!res.ok) throw new Error(res.error || 'ไม่ทราบสาเหตุ');
                pendingId = null;
                alert(res.duplicate ? 'ข้อมูลชุดนี้ถูกส่งไปแล้วก่อนหน้านี้' : 'ส่งข้อมูลเรียบร้อยแล้ว (' + rows.length + ' รายการ)\nบันทึกไฟล์ Excel ลง Google Drive แล้ว');
            })
            .catch(function (err) {
                alert('ส่งไม่สำเร็จ: ' + err.message + '\nตรวจอินเทอร์เน็ตแล้วกดส่งอีกครั้งได้ ระบบกันข้อมูลซ้ำให้');
            })
            .then(function () { btn.disabled = false; btn.textContent = label; });
    });

    refresh();
</script>
